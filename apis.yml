  humanURL: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
  baseURL: https://api.trainerize.com/v03
  properties:
  - url: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
    type: Documentation
  - url: openapi/trainerize-openapi.yml
    type: OpenAPI
  description: Add, modify, and retrieve a client's goals, habits, body stats,
    nutrition, and appointments. Reflects the documented ability to read and write
    these client data domains through the API; exact request shapes are gated.
- aid: trainerize:trainerize-messaging-api
