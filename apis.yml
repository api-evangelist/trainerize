name: ABC Trainerize
kind: company
description: ABC Trainerize is a personal-training and fitness-coaching software
  platform for trainers, studios, and gyms - online training, workout programming,
  nutrition and meal planning, habit and goal tracking, in-app messaging, and a
  custom-branded client app. Its partner API (Studio and Enterprise plans) lets
  integrators add, modify, and retrieve client data - clients, programs and
  workouts, goals, habits, body stats, nutrition, appointments, tags, and
  groups - and register webhooks for business events. ABC Trainerize is a product
  of ABC Fitness Solutions, which acquired Trainerize in 2021.
