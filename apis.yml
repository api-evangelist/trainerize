  tags:
  - Messaging
  - Attachments
  - Communication
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
  baseURL: https://api.trainerize.com/v03
  properties:
  - url: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
    type: Documentation
  - url: openapi/trainerize-openapi.yml
    type: OpenAPI
  description: Send in-app messages to clients and upload attachments such as
    meal-plan PDFs. Modeled from the documented Send Message and Upload Attachment
    actions.
- aid: trainerize:trainerize-webhooks-api
  name: ABC Trainerize Webhooks API
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
  baseURL: https://api.trainerize.com/v03
  properties:
  - url: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
    type: Documentation
  - url: openapi/trainerize-openapi.yml
    type: OpenAPI
  description: Register, list, and delete webhook subscriptions that notify an
    external system when a business event occurs - workout completed, cardio
    completed, habit completed, daily nutrition goal hit, weight goal hit, new
    client, new purchase, product start/end, auto-renew cancelled, and tag
    added/removed. Webhooks are one-way, server-to-endpoint HTTP POSTs.
