apis:
- aid: trainerize:trainerize-clients-api
  name: ABC Trainerize Clients API
  tags:
  - Clients
  - Client Management
  - CRM
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
  baseURL: https://api.trainerize.com/v03
  properties:
  - url: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
    type: Documentation
  - url: openapi/trainerize-openapi.yml
    type: OpenAPI
  description: Create, update, find, deactivate, and reactivate clients; assign
    clients to trainers; and manage client tags and group membership. Used to
    onboard clients from a form or sync them with a CRM. Modeled from ABC
    Trainerize's documented client actions; exact paths are gated.
- aid: trainerize:trainerize-training-api
  name: ABC Trainerize Training Programs API
  tags:
  - Workout Programming
  - Programs
  - Workouts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
  baseURL: https://api.trainerize.com/v03
  properties:
  - url: https://help.trainerize.com/hc/en-us/articles/37082084919060-Using-API-and-Webhooks-With-ABC-Trainerize
    type: Documentation
  - url: openapi/trainerize-openapi.yml
    type: OpenAPI
  description: Assign training to clients - copy a master program onto a client,
    subscribe a client to a main or add-on program, unsubscribe from programs, add
    the next training phase, and retrieve a client's workouts. Modeled from
    documented program actions.
- aid: trainerize:trainerize-client-data-api
